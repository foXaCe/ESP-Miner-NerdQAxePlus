repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        # JSONC files (comments allowed) are not valid JSON
        exclude: |
          (?x)^(
            \.devcontainer/.*\.json
            | .*/\.vscode/.*\.json
            | .*/tsconfig.*\.json
          )
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
